<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>

  <link rel="stylesheet" href="forgot-password.css">
</head>

<body>

  <div class="card">
    <div class="brand">
      <img src="logo.png" alt="Logo" onerror="this.remove()">
    </div>

    <h1>Forgot password</h1>
    <p class="lede">Enter your email address and we will send you a link to reset your password.</p>

    <form id="resetForm">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="name@company.com" autocomplete="email" required>

      <button type="submit" id="sendBtn">Send reset link</button>
      <div class="status" id="status"></div>
    </form>

    <p class="auth-foot">&copy; <span class="yr"></span> WZONE London. All rights reserved.</p>
  </div>

  <script src="forgot-password.js"></script>

</body>

</html>
