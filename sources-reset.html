<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Files Password</title>

  <link rel="stylesheet" href="sources-reset.css">

</head>

<body>

  <div class="card">
    <div class="brand">
      <img src="logo.png" alt="Logo" onerror="this.remove()">
    </div>

    <h1>New Files password</h1>
    <p class="intro">
      This is the password that opens your Files page. It is separate
      from your admin login, which is unchanged.
    </p>

    <div id="form">
      <label for="password">New password</label>
      <input type="password" id="password" placeholder="At least 8 characters"
        onkeydown="if(event.key==='Enter') submitReset()">

      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" placeholder="Repeat the password"
        onkeydown="if(event.key==='Enter') submitReset()">

      <button type="button" id="submitBtn" onclick="submitReset()">Set password</button>
    </div>

    <div class="status" id="status"></div>

    <p class="foot"><a href="admin-login.html">Back to admin login</a></p>
  </div>

  <script src="sources-reset.js"></script>

</body>

</html>
