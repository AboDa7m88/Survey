<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survey</title>

  <link rel="stylesheet" href="survey.css">

</head>

<body>

  <div class="container">

    <a href="forms.html" class="back">← Back to Forms</a>

    <div class="card">

      <div id="completedBox"></div>

      <h1 id="surveyTitle" dir="auto">Loading...</h1>
      <p class="subtitle" id="surveyMeta">Please answer all required questions.</p>
      <p class="subtitle" id="surveyDescription" dir="auto" hidden></p>

      <div id="questionsWrap"></div>
      <div class="confirm-box" id="confirmBox">
        <label>
          <input type="checkbox" id="confirmSubmit">
          I have reviewed all questions before submitting this form.
        </label>
      </div>
      <button class="submit" id="submitBtn" onclick="submitSurvey()">
        Submit Survey
      </button>

      <div class="status" id="status"></div>

    </div>

  </div>

  <script src="survey.js"></script>

</body>

</html>
