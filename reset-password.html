<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>

  <link rel="stylesheet" href="reset-password.css">
</head>

<body>

  <div class="card">
    <div class="brand">
      <img src="logo.png" alt="Logo" onerror="this.remove()">
    </div>

    <h1>Reset password</h1>
    <p class="lede" id="lede">Choose a new password for your account.</p>

    <form id="resetForm">
      <label for="password">New password</label>
      <div class="password-box">
        <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password">
        <span class="toggle-password" onclick="togglePassword('password')" role="button" aria-label="Show password">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M2.458 12C3.732 7.943 7.523 5 12 5s8.268 2.943 9.542 7c-1.274 4.057-5.065 7-9.542 7S3.732 16.057 2.458 12z" />
          </svg>
        </span>
      </div>

      <label for="confirm">Confirm password</label>
      <div class="password-box">
        <input type="password" id="confirm" placeholder="Re-enter your password" autocomplete="new-password">
        <span class="toggle-password" onclick="togglePassword('confirm')" role="button" aria-label="Show password">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M2.458 12C3.732 7.943 7.523 5 12 5s8.268 2.943 9.542 7c-1.274 4.057-5.065 7-9.542 7S3.732 16.057 2.458 12z" />
          </svg>
        </span>
      </div>

      <button type="submit" id="saveBtn">Reset password</button>
      <div class="status" id="status"></div>
    </form>

    <div class="foot">
      <a href="login.html">&larr; Back to login</a>
      <a href="forgot-password.html">Request a new link</a>
    </div>

    <p class="auth-foot">&copy; <span class="yr"></span> WZONE London. All rights reserved.</p>
  </div>

  <script src="reset-password.js"></script>

</body>

</html>
