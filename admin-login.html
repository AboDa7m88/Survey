<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>

  <link rel="stylesheet" href="admin-login.css">

</head>

<body>

  <div class="card">
    <div class="brand">
      <img src="logo.png" alt="Logo" onerror="this.remove()">
    </div>

    <h1>Admin Login</h1>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="admin@wzone.com">

    <div class="label-row">
      <label for="password">Password</label>
      <a class="forgot" href="forgot-password.html">Forgot password?</a>
    </div>

    <div class="password-box">
      <input type="password" id="password" placeholder="Password">
      <span class="toggle-password" onclick="togglePassword()">
        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M2.458 12C3.732 7.943 7.523 5 12 5s8.268 2.943 9.542 7c-1.274 4.057-5.065 7-9.542 7S3.732 16.057 2.458 12z" />
        </svg>
      </span>
    </div>
    <button onclick="loginAdmin()">Login</button>

    <!-- Local preview only: skips the API so the admin pages can be looked at
       without a database. Hidden unless served from localhost, so it never
       renders in production. -->
    <button type="button" id="devBypass" hidden onclick="devBypass()"
      style="margin-top:10px;background:#eef0f6;color:#1b1e3a;">
      Bypass login (local preview)
    </button>

    <div class="status" id="status"></div>

    <p class="auth-foot">&copy; <span class="yr"></span> WZONE London. All rights reserved.</p>
  </div>

  <script src="admin-login.js"></script>

</body>

</html>
