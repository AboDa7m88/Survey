<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login / Register</title>

  <link rel="stylesheet" href="login.css">
</head>

<body>
  <div class="auth-layout">
    <!-- Stays hidden unless an admin has uploaded slides in Settings and
           the first image actually decodes - see loadLoginSlides(). -->
    <aside class="auth-slideshow" id="authSlideshow" hidden aria-hidden="true">
      <div class="slide-stack" id="slideStack"></div>
      <div class="slide-dots" id="slideDots"></div>
    </aside>

    <button class="mobile-cta" type="button" onclick="openMobileAuth()">
      Login
    </button>

    <button class="mobile-back" type="button" aria-label="Back" onclick="closeMobileAuth()">
      &#8592;
    </button>

    <div class="auth-pane">
      <div class="auth-wrapper">
        <!-- Login Card -->
        <div class="card login-card">
          <div class="brand">
            <img src="logo.png" alt="Logo" onerror="this.remove()" />
          </div>

          <div class="tabs">
            <button class="active" onclick="showLogin()">Log In</button>
            <button onclick="showRegister()">Register</button>
          </div>

          <div class="form-group">
            <label>Email Address</label>
            <div class="input-box">
              <span>✉</span>
              <input type="email" id="loginEmail" />
            </div>
          </div>

          <div class="form-group">
            <div class="form-row">
              <label>Password</label>
              <a href="forgot-password.html" class="forgot">Forgot password?</a>
            </div>
            <div class="input-box">
              <span>🔒</span>
              <input type="password" id="loginPassword" />
              <button class="eye" type="button" onclick="togglePassword('loginPassword')">
                ◉
              </button>
            </div>
          </div>

          <button class="submit" onclick="loginUser()">Log In →</button>

          <!-- Local preview only: skips the API so the pages behind the login can
             be looked at without a database. Hidden unless the page is being
             served from localhost, so it never renders in production. -->
          <button class="submit" type="button" id="devBypass" hidden onclick="devBypass()"
            style="margin-top:10px;background:#eef0f6;color:#1b1e3a;">
            Bypass login (local preview)
          </button>
          <div class="switch-text">
            New to the platform?
            <button type="button" onclick="window.location.href = 'admin-login.html'"
              style="text-decoration: underline; color: #000000">
              Sign Up
            </button>
          </div>

          <div class="status" id="loginStatus"></div>

          <p class="auth-foot">
            &copy; <span class="yr"></span> WZONE London. All rights reserved.
          </p>
        </div>

        <!-- Register Card -->
        <div class="card register-card">
          <div class="brand">
            <img src="logo.png" alt="Logo" onerror="this.remove()" />
          </div>

          <div class="tabs">
            <button onclick="showLogin()">Log In</button>
            <button class="active" onclick="showRegister()">Register</button>
          </div>

          <div class="form-group">
            <label>Full Name</label>
            <div class="input-box">
              <span>♙</span>
              <input type="text" id="registerName" />
            </div>
          </div>

          <div class="form-group">
            <label>Work Email</label>
            <div class="input-box">
              <span>✉</span>
              <input type="email" id="registerEmail" />
            </div>
          </div>

          <div class="form-group">
            <label>Company Name</label>
            <div class="input-box">
              <span>▦</span>
              <input type="text" id="companyName" required maxlength="150" autocomplete="organization" dir="auto" />
            </div>
          </div>

          <div class="form-group">
            <label>Password</label>
            <div class="input-box">
              <span>🔒</span>
              <input type="password" id="registerPassword" />
              <button class="eye" type="button" onclick="togglePassword('registerPassword')">
                ◉
              </button>
            </div>
            <div class="note">
              Requires 8+ characters with uppercase and symbols.
            </div>
          </div>

          <label class="terms">
            <input type="checkbox" id="termsCheck" />
            <span>I agree to the <a href="#">Terms</a> and
              <a href="#">Privacy Policy</a>.</span>
          </label>

          <button class="submit" onclick="registerUser()">Register →</button>
          <div class="switch-text">
            Already have an account?
            <button type="button" onclick="showLogin()" style="text-decoration: underline; color: #000000">
              Log In
            </button>
          </div>

          <div class="status" id="registerStatus"></div>

          <p class="auth-foot">
            &copy; <span class="yr"></span> WZONE London. All rights reserved.
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>

</html>
