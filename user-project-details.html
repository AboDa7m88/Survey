<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project</title>

  <link rel="stylesheet" href="user-project-details.css">

  <script>
    // Runs before paint so the collapsed state never flashes open on load.
    (function () {
      var root = document.documentElement;
      var KEY = "wz_sidebar_collapsed";
      var MOBILE = 950;
      var DRAWER = 768;   // below this the sidebar is a drawer, never a rail
      function prefersCollapsed() { return localStorage.getItem(KEY) === "1"; }
      function apply() {
        root.classList.toggle("sidebar-collapsed", window.innerWidth > DRAWER && (window.innerWidth <= MOBILE || prefersCollapsed()));
      }
      window.toggleSidebar = function () {
        if (window.innerWidth <= MOBILE) return; // forced collapsed, nothing to toggle
        localStorage.setItem(KEY, prefersCollapsed() ? "0" : "1");
        apply();
      };
      apply();
      window.addEventListener("resize", apply);
    })();

    // Sidebar account card -> dropup with Profile / Logout.
    (function () {
      function menu() { return document.getElementById("account"); }
      function close() {
        var el = menu();
        if (!el || !el.classList.contains("open")) return;
        el.classList.remove("open");
        el.querySelector(".user-card").setAttribute("aria-expanded", "false");
      }
      window.toggleAccountMenu = function () {
        var el = menu();
        var open = el.classList.toggle("open");
        el.querySelector(".user-card").setAttribute("aria-expanded", open ? "true" : "false");
      };
      document.addEventListener("click", function (e) {
        var el = menu();
        if (el && !el.contains(e.target)) close();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") close();
      });
    })();
  </script>
  <link rel="stylesheet" href="assets/shell.css?v=5" />
</head>

<body>

  <div class="app">

    <aside class="sidebar">
      <div>
        <div class="side-head">
          <div class="logo">
            <img src="logo.png" alt="Logo" onerror="this.remove()">
          </div>
          <button class="sidebar-toggle" type="button" onclick="toggleSidebar()" title="Toggle sidebar"
            aria-label="Toggle sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="16" rx="2.5" />
              <path d="M9.5 4v16" />
            </svg>
          </button>
        </div>
        <nav class="nav">
          <a href="dashboard.html" title="Dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1.5" />
              <rect x="14" y="3" width="7" height="7" rx="1.5" />
              <rect x="3" y="14" width="7" height="7" rx="1.5" />
              <rect x="14" y="14" width="7" height="7" rx="1.5" />
            </svg>
            <span>Dashboard</span>
          </a>
          <a href="forms.html" title="Forms">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
              <path d="M14 3v5h5" />
              <path d="M9 13h6M9 17h4" />
            </svg>
            <span>Forms</span>
          </a>
          <a href="user-projects.html" class="active" title="Projects">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <rect x="2" y="7" width="20" height="14" rx="2" />
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
            </svg>
            <span>Projects</span>
          </a>
          <a href="content.html" title="Content">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2.5" />
              <path d="M3 9h18" />
              <path d="M9 21V9" />
            </svg>
            <span>Content</span>
          </a>
          <a href="notifications.html" title="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M18 8a6 6 0 1 0-12 0c0 6-3 7-3 7h18s-3-1-3-7" />
              <path d="M13.7 21a2 2 0 0 1-3.4 0" />
            </svg>
            <span>Notifications</span>
            <em class="nav-badge" id="notifBadge" hidden></em>
          </a>
          <a href="help.html" title="Help Center">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <circle cx="12" cy="12" r="9.5" />
              <path d="M9.5 9.5a2.6 2.6 0 1 1 3.4 2.5c-.6.2-.9.8-.9 1.4v.4" />
              <path d="M12 17h.01" />
            </svg>
            <span>Help Center</span>
          </a>
        </nav>
      </div>

      <div class="account" id="account">
        <button class="user-card" type="button" onclick="toggleAccountMenu()" aria-haspopup="true" aria-expanded="false"
          title="Account">
          <div class="avatar" id="sideAvatar">U</div>
          <div class="user-meta">
            <h4 id="sideName">User</h4>
            <p>Pro Member</p>
          </div>
          <svg class="user-dots" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="5" r="1.6" />
            <circle cx="12" cy="12" r="1.6" />
            <circle cx="12" cy="19" r="1.6" />
          </svg>
        </button>
        <div class="account-menu" role="menu">
          <a role="menuitem" href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg><span>Profile</span></a>
          <button role="menuitem" type="button" class="danger" onclick="logout()"><svg viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg><span>Logout</span></button>
        </div>
      </div>
    </aside>

    <main class="main">

      <section class="content">

        <div class="head">
          <a class="back-link" href="user-projects.html" title="Back to projects" aria-label="Back to projects">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M19 12H5" />
              <path d="M11 6l-6 6 6 6" />
            </svg>
          </a>
          <div class="page-title">
            <h1 id="projectTitle" dir="auto">Loading...</h1>
            <p id="projectSubtitle">&nbsp;</p>
          </div>
        </div>

        <div id="notFound" class="empty" hidden>This project does not exist, or is not one of yours.</div>

        <div id="projectBody" hidden>

          <div class="tiles">
            <div class="tile"><span>Start</span><strong id="tileStart">—</strong></div>
            <div class="tile"><span>End</span><strong id="tileEnd">—</strong></div>
            <div class="tile">
              <span>Progress</span>
              <strong id="tileProgress">0%</strong>
              <div class="bar"><i id="tileBar" style="width:0%"></i></div>
            </div>
          </div>

          <!-- The month the updates are dated in. Opens on the month the project
           starts in rather than on today: a client will not think to page back
           six months to find where the work began. Paging it is pure client
           state - every update came down with the project. -->
          <div class="cal-card">
            <div class="cal-head">
              <h2 id="calLabel">—</h2>
              <div class="cal-nav">
                <button type="button" id="calPrev" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 6l-6 6 6 6" />
                  </svg></button>
                <button type="button" id="calNext" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 6l6 6-6 6" />
                  </svg></button>
              </div>
              <button class="cal-today" type="button" id="calToday">Today</button>
            </div>
            <div class="cal-scroll">
              <div class="cal-grid">
                <div class="cal-week names">
                  <div>Mon</div>
                  <div>Tue</div>
                  <div>Wed</div>
                  <div>Thu</div>
                  <div>Fri</div>
                  <div>Sat</div>
                  <div>Sun</div>
                </div>
                <div id="calBody"></div>
              </div>
            </div>
          </div>

          <div class="section-head">
            <h2 id="tasksHeading">Updates</h2>
            <button class="btn btn-ghost" type="button" id="clearDayBtn" onclick="clearDay()" hidden>Show all
              updates</button>
          </div>
          <div class="grid" id="taskGrid"></div>

          <div class="pager" id="pager" hidden>
            <div class="pager-info" id="pagerInfo"></div>
            <div class="pager-pages" id="pagerPages"></div>
          </div>

          <!-- Opened by the View button on a card. Inline rather than a modal:
           it is the pattern content.html already established, and the one
           thing that gives an update's orientation a job. -->
          <div class="detail-wrap" id="detailWrap" style="display:none">
            <div class="detail-head">
              <div class="eyebrow" id="detailEyebrow"></div>
              <h2 id="detailTitle" dir="auto"></h2>
            </div>

            <article class="detail is-horizontal" id="detailPanel">
              <!-- Click to open it full size. See assets/lightbox.js. -->
              <div class="detail-media" id="detailMedia" data-lightbox data-lightbox-alt="Task image"></div>
              <div class="detail-meta">
                <div class="field wide">
                  <h5>Update</h5>
                  <div class="caption" id="detailDescription" dir="auto"></div>
                </div>

                <div class="detail-footer">
                  <div class="field">
                    <h5>Date</h5>
                    <p id="detailScheduled">No date set</p>
                  </div>
                  <div class="field link-slot" id="linkSlot"></div>
                  <div class="field">
                    <h5>Status</h5>
                    <p id="detailStatus">—</p>
                  </div>
                </div>
              </div>
            </article>
          </div>

          <div class="section-head" style="margin-top:26px">
            <h2>Project Details</h2>
          </div>
          <div class="project-panel">
            <div class="project-panel-img" id="projectImg" hidden></div>
            <h3 id="panelTitle" dir="auto">—</h3>
            <span class="desc-label">Description</span>
            <p class="desc" id="panelDesc" dir="auto">—</p>
            <div class="project-meta">
              <div class="field"><span>Type</span><strong id="panelType">—</strong></div>
              <div class="field"><span>Timeline</span><strong id="panelTimeline">—</strong></div>
              <div class="field"><span>Status</span><strong class="link" id="panelStatus">—</strong></div>
            </div>
          </div>

        </div>

      </section>
    </main>

  </div>

  <script src="user-project-details.js"></script>

  <script src="assets/notifications.js?v=1"></script>
  <script src="assets/shell.js?v=4"></script>
  <script src="assets/lightbox.js?v=1"></script>
</body>

</html>
