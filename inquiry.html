<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inquiry</title>
  <link rel="stylesheet" href="inquiry.css">
</head>

<body>

  <div class="page">

    <header class="masthead">
      <!-- The anchor starts with no href, so it is a plain image until the
         website address the owner set on settings.html comes back with the
         inquiry. Same logo fallback the admin pages use, so a deploy without
         logo.png at the root still shows a wordmark rather than a gap. -->
      <a id="logoLink">
        <img src="logo.png" alt="Logo" onerror="this.remove()">
      </a>
    </header>

    <div id="view">
      <div class="loading">Loading...</div>
    </div>

  </div>

  <script src="inquiry.js"></script>

</body>

</html>
